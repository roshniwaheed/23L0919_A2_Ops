
{% extends "base.html" %}

{% block title %}Upload Error | VisionGuard{% endblock %}

{% block content %}

<section class="error-card">
    <div class="error-icon">!</div>

    <h1>Something went wrong</h1>

    <p>{{ message }}</p>

    <a href="{{ url_for('upload') }}"
       class="primary-btn link-btn">
        Try Again →
    </a>
</section>

{% endblock %}
