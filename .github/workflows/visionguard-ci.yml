
name: VisionGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install testing and DVC tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff "dvc[http]==3.59.0" "pathspec==0.12.1"

      - name: Lint Python files
        run: |
          ruff check webapp/ scripts/ tests/ --select E4,E7,E9,F63,F7,F82

      - name: Run smoke tests
        run: |
          python -m pytest tests/test_project_ci.py -v

      - name: Configure DagsHub credentials
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          test -n "$DAGSHUB_TOKEN"
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"

      - name: Download trained models from DagsHub
        run: |
          dvc pull -r dagshub models.dvc
          test -f models/mobilenet_best.keras

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build VisionGuard Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: visionguard-web:ci
